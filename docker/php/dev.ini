; Development PHP settings, mounted into the php container (see docker-compose.yml).

; `php artisan serve` runs PHP's built-in server, which is the CLI version of
; PHP, where OPcache is off by default. Without it every request re-reads and
; recompiles hundreds of Laravel files, which is slow on a Windows/macOS bind mount.
opcache.enable_cli = 1

; Check whether a file changed at most every 2 seconds. Checking on every
; request (0) means hundreds of slow file-system calls per request on a bind
; mount; 2 s is short enough that saved code changes still show up right away.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Remember resolved file paths longer (fewer filesystem lookups).
realpath_cache_size = 4096K
realpath_cache_ttl = 600
