services:
  php:
    # Built from docker/php/Dockerfile (PHP 8.4 + pdo_mysql + Composer)
    build: ./docker/php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html/backend
    depends_on:
      - mysql
    tty: true
    # 0.0.0.0 = listen on all interfaces so your PC (and the frontend container) can reach it
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"

  mysql:
    image: mysql:8.0
    container_name: stockpulse_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockpulse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Creates the stockpulse_testing database on first start (see the file)
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  frontend:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps node_modules inside the container (Linux builds),
      # separate from your Windows folder
      - /app/node_modules
    # Install packages if needed, then start Vite on all interfaces
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - php

volumes:
  mysql_data:
